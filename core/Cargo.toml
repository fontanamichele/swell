[workspace]
resolver = "2"
members = ["core-model", "core-store", "core-search", "core-history", "core-logins", "core-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"
rusqlite = "0.37"
core-model = { path = "core-model" }
core-store = { path = "core-store" }
core-search = { path = "core-search" }
core-history = { path = "core-history" }
core-logins = { path = "core-logins" }
uniffi = "0.32"
tempfile = "3"
