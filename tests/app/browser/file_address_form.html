<!DOCTYPE html>
<meta charset="utf-8">
<title>address</title>
<form id="form" action="https://example.com/browser/swell/tests/app/browser/file_blank.html" method="get">
  <input type="text" id="name" name="name" autocomplete="name">
  <input type="text" id="org" name="org" autocomplete="organization">
  <input type="text" id="street" name="street" autocomplete="street-address">
  <input type="text" id="city" name="city" autocomplete="address-level2">
  <input type="text" id="state" name="state" autocomplete="address-level1">
  <input type="text" id="zip" name="zip" autocomplete="postal-code">
  <select id="country" name="country" autocomplete="country">
    <option value="">--</option>
    <option value="US">United States</option>
    <option value="CA">Canada</option>
  </select>
  <input type="text" id="email" name="email" autocomplete="email">
  <input type="text" id="tel" name="tel" autocomplete="tel">
  <input type="submit" id="submit">
</form>
