<html
  xmlns="http://www.w3.org/1999/xhtml"
  id="swell-window"
  windowtype="navigator:browser"
  scrolling="false"
  width="1280"
  height="800"
  screenX="60"
  screenY="40"
  persist="screenX screenY width height sizemode"
>
  <head>
    <meta charset="utf-8" />
    <title>Swell</title>
    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link rel="stylesheet" href="chrome://swell/content/window.css" />
    <link
      rel="stylesheet"
      href="chrome://formautofill/content/formautofill.css"
    />
    <script src="chrome://global/content/customElements.js"></script>
    <script type="module" src="chrome://swell/content/window.mjs"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="navbar">
          <div class="nav-pill">
            <button id="nav-address" class="nav-address"></button>
            <button
              id="nav-copy"
              class="nav-button"
              title="Copy address"
              aria-label="Copy address"
            ></button>
          </div>
        </div>
        <div id="extension-actions" hidden=""></div>
        <div id="favorites" class="favorites"></div>
        <div id="lists">
          <section class="list" id="pinned-section">
            <header>
              <span class="heading">Pinned</span>
              <button id="new-folder" class="icon-button" title="New folder">
                +
              </button>
            </header>
            <div id="pinned" class="tree" data-root="pinned"></div>
          </section>
          <section class="list" id="today-section">
            <header><span class="heading">Today</span></header>
            <button id="new-tab" class="new-tab">New tab</button>
            <div id="today" class="tree" data-root="today"></div>
          </section>
        </div>
        <footer id="sidebar-footer">
          <div id="footer-row">
            <nav id="spaces" aria-label="Spaces"></nav>
            <button id="more" class="icon-button" title="More">&#x22EF;</button>
          </div>
        </footer>
      </aside>
      <div id="sidebar-peek-edge"></div>
      <div
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
      ></div>
      <main id="content">
        <div id="permission-bar" hidden="">
          <span class="permission-text"></span>
          <button id="permission-allow">Allow</button>
          <button id="permission-block">Block</button>
          <button id="permission-later">Not now</button>
        </div>
        <div id="media-bar" hidden="">
          <span class="media-text"></span>
          <select id="media-camera" hidden=""></select>
          <select id="media-microphone" hidden=""></select>
          <select id="media-screen" hidden=""></select>
          <label id="media-remember-label">
            <input type="checkbox" id="media-remember" /> Remember
          </label>
          <button id="media-allow">Allow</button>
          <button id="media-block">Block</button>
          <button id="media-later">Not now</button>
        </div>
        <div id="media-indicator" hidden="">
          <span class="media-indicator-text"></span>
          <button id="media-stop">Stop sharing</button>
        </div>
        <div id="autofill-bar" hidden="">
          <span class="autofill-text"></span>
          <button id="autofill-save">Save</button>
          <button id="autofill-create" hidden="">Save as new</button>
          <button id="autofill-never">Never</button>
          <button id="autofill-later">Not now</button>
        </div>
        <div id="pages"></div>
        <div id="findbars"></div>
        <div id="empty">
          <p class="empty-title">Swell</p>
          <p class="empty-hint">
            <kbd id="new-tab-key">T</kbd> opens a new tab
          </p>
        </div>
      </main>
    </div>
    <div id="titlebar">
      <div id="titlebar-left">
        <div id="window-buttons-box"></div>
        <button
          id="sidebar-toggle"
          class="nav-button"
          aria-label="Hide sidebar"
          aria-expanded="true"
        ></button>
        <div id="nav-buttons">
          <button id="nav-back" class="nav-button" aria-label="Back"></button>
          <button
            id="nav-forward"
            class="nav-button"
            aria-label="Forward"
          ></button>
          <button
            id="nav-reload"
            class="nav-button"
            aria-label="Reload"
          ></button>
        </div>
      </div>
      <div id="window-controls" hidden="">
        <button
          id="window-minimize"
          class="window-control"
          title="Minimize"
        ></button>
        <button
          id="window-maximize"
          class="window-control"
          title="Maximize"
        ></button>
        <button
          id="window-restore"
          class="window-control"
          title="Restore"
        ></button>
        <button id="window-close" class="window-control" title="Close"></button>
      </div>
    </div>
    <div id="commandbar" hidden="">
      <div class="panel">
        <input
          id="commandbar-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Search or enter address"
        />
        <ul id="commandbar-list" role="listbox"></ul>
      </div>
    </div>
    <div id="menu" hidden=""></div>
    <div id="extension-popup" hidden=""></div>
    <panel
      xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      is="autocomplete-richlistbox-popup"
      type="autocomplete-richlistbox"
      id="PopupAutoComplete"
      role="group"
      level="top"
      noautofocus="true"
      hidden="true"
      overflowpadding="4"
      norolluponanchor="true"
      nomaxresults="true"
      locationspecific="true"
    />
    <div id="toasts"></div>
    <dialog id="extensions-dialog">
      <div id="extensions-list"></div>
      <div class="buttons">
        <button type="button" id="extensions-close">Close</button>
      </div>
    </dialog>
    <dialog id="extension-prompt">
      <h3 id="extension-prompt-title"></h3>
      <p>It will be able to use:</p>
      <ul id="extension-prompt-permissions"></ul>
      <div class="buttons">
        <button type="button" id="extension-prompt-cancel">Cancel</button>
        <button type="button" id="extension-prompt-add">Add</button>
      </div>
    </dialog>
    <dialog id="passwords-dialog">
      <div id="passwords-list"></div>
      <form id="passwords-form" hidden="" method="dialog"></form>
      <div class="buttons">
        <button type="button" id="passwords-close">Close</button>
      </div>
    </dialog>
    <dialog id="autofill-dialog">
      <div id="autofill-lists"></div>
      <form id="autofill-form" hidden="" method="dialog"></form>
      <div class="buttons">
        <button type="button" id="autofill-close">Close</button>
      </div>
    </dialog>
    <dialog id="downloads-dialog">
      <div id="downloads-list"></div>
      <div class="buttons">
        <button type="button" id="downloads-close">Close</button>
      </div>
    </dialog>
    <dialog id="space-dialog">
      <form method="dialog" id="space-form">
        <h3 id="space-dialog-title">New space</h3>
        <div class="space-fields">
          <button
            type="button"
            id="space-emoji-button"
            class="emoji-button"
            aria-haspopup="true"
            aria-expanded="false"
          ></button>
          <input
            id="space-title"
            type="text"
            autocomplete="off"
            placeholder="Name"
            aria-label="Name"
          />
        </div>
        <div id="emoji-picker" hidden="">
          <input
            id="emoji-search"
            type="search"
            autocomplete="off"
            placeholder="Search emoji"
            aria-label="Search emoji"
          />
          <div id="emoji-tabs"></div>
          <div id="emoji-grid"></div>
          <button type="button" id="emoji-clear" class="link-button">
            Use the first letter of the name
          </button>
        </div>
        <div class="buttons">
          <button type="button" id="space-cancel">Cancel</button>
          <button id="space-save">Create space</button>
        </div>
      </form>
    </dialog>
    <dialog id="delete-space-dialog">
      <h3>Delete <span id="delete-space-name"></span>?</h3>
      <p>
        Its tabs, folders, history, saved passwords, addresses and cards,
        cookies and site data, permissions and add-ons are removed, and so are
        its downloads from the list. This cannot be undone.
      </p>
      <div class="buttons">
        <button type="button" id="delete-space-cancel">Cancel</button>
        <button type="button" id="delete-space-confirm" class="danger">
          Delete space
        </button>
      </div>
    </dialog>
  </body>
</html>
